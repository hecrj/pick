[package]
name = "pick"
version = "0.1.0"
edition = "2024"

[dependencies]
iced.version = "0.15.0-dev"
iced.features = ["tokio", "sipper", "markdown", "canvas", "highlighter"]

serde.version = "1"
serde.features = ["derive"]

similar.version = "3"
similar.features = ["inline"]

tokio.version = "1"
tokio.features = ["fs", "macros", "process", "sync", "test-util"]

tracing-subscriber.version = "0.3"
tracing-subscriber.features = ["tracing-log"]

function = "0.3"
log = "0.4"
reason = "0.2.0-dev"
serde_json = "1"
sipper = "0.2"

[lints.clippy]
large-enum-variant = "allow"
type-complexity = "allow"

[patch.crates-io]
cosmic-text.git = "https://github.com/hecrj/cosmic-text.git"
cosmic-text.rev = "c46a7e3d29cc43078cc77f843e8d51ad0adad118"

iced.git = "https://github.com/iced-rs/iced.git"
iced.rev = "f3ee4cfdc2bb7d26dea628986e343c24dac532f0"

reason.git = "https://github.com/hecrj/reason.git"
reason.rev = "c9e272270820ee75ba1e817d479a88ee9f1550b0"

# iced.path = "../iced"
# reason.path = "../reason"
